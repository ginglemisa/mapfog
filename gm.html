<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GM 戰爭迷霧地圖</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel2: #0f172a;
      --text: #f9fafb;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --danger: #ef4444;
      --line: #334155;
    }
    * { box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: var(--text);
    }
    .wrap {
      position: fixed;
      inset: 0;
      max-width: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .panel {
      background: rgba(31, 41, 55, 0.92);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }
    .controls-panel {
      position: fixed;
      top: 72px;
      right: 16px;
      z-index: 35;
      width: min(392px, calc(100vw - 24px));
      max-height: calc(100svh - 88px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 8px;
      background: rgba(11, 18, 32, 0.92);
      box-shadow: 0 16px 34px rgba(0,0,0,.38);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
    }
    .controls-panel[hidden] {
      display: none;
    }
    .controls-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .controls-panel-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .controls-body {
      display: grid;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .controls-panel .toolbar {
      grid-template-columns: minmax(0, 1fr);
    }
    .controls-panel input[type="range"] {
      margin-inline: 0;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .hint {
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      align-items: end;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 14px;
      color: var(--muted);
    }
    input[type="range"], input[type="file"], button {
      width: 100%;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--line);
      background: #0b1220;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
    }
    @media (hover: hover) {
      button:hover { border-color: var(--accent); }
      button:disabled:hover {
        border-color: var(--line);
      }
      .danger:hover { border-color: var(--danger); }
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }
    .value {
      font-size: 14px;
      color: white;
      font-weight: 700;
    }
    .mode-note {
      font-size: 13px;
      color: var(--muted);
    }
    .stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: #020617;
      touch-action: none;
    }
    .viewport {
      width: 100%;
      height: 100svh;
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }
    .viewport.panning {
      cursor: grabbing;
    }
    .canvas-holder {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      display: inline-block;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    canvas {
      display: block;
      max-width: none;
      image-rendering: auto;
      border-radius: 0;
      box-shadow: none;
      touch-action: none;
    }
    #gridCanvas,
    #fogCanvas {
      position: absolute;
      inset: 0;
      box-shadow: none;
    }
    #gridCanvas {
      pointer-events: none;
    }
    .token-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }
    .map-token {
      position: absolute;
      left: 0;
      top: 0;
      width: 96px;
      height: 96px;
      overflow: hidden;
      border: 2px solid rgba(248, 250, 252, 0.9);
      background: rgba(15, 23, 42, 0.68);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.42);
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .map-token.square {
      border-radius: 8px;
    }
    .map-token.hex {
      clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%);
    }
    .map-token.dragging {
      cursor: grabbing;
    }
    .map-token.selected {
      z-index: 1;
    }
    .map-token img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }
    .gm-page #fogCanvas {
      opacity: 0.48;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 48px 24px;
      line-height: 1.8;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .footer-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .cache-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .cache-actions button {
      width: auto;
      min-width: 180px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    .checkbox {
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }
    .checkbox input {
      width: auto;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      margin-left: 6px;
    }
  
    .floating-toolbar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      gap: 8px;
      align-items: center;
      z-index: 30;
      background: rgba(11, 18, 32, 0.78);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .tool-button {
      width: 48px;
      height: 48px;
      min-width: 48px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font-size: 0;
      line-height: 1;
      background: #0b1220;
    }
    .tool-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .tool-button.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.2) inset;
    }
    .rect-fog-preview {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 8;
      display: none;
      border: 2px solid rgba(56, 189, 248, 0.95);
      border-radius: 2px;
      background: rgba(56, 189, 248, 0.18);
      box-shadow: 0 0 0 1px rgba(2, 6, 23, 0.58);
      pointer-events: none;
    }
    .rect-fog-preview.fill {
      border-color: rgba(248, 250, 252, 0.92);
      background: rgba(15, 23, 42, 0.38);
    }
    .grid-panel,
    .token-panel {
      position: fixed;
      top: 72px;
      right: 16px;
      z-index: 34;
      width: min(392px, calc(100vw - 24px));
      max-height: calc(100svh - 88px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 8px;
      background: rgba(11, 18, 32, 0.92);
      box-shadow: 0 16px 34px rgba(0,0,0,.38);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
    }
    .grid-panel[hidden],
    .token-panel[hidden] {
      display: none;
    }
    .grid-panel-header,
    .token-panel-header,
    .token-control-line,
    .grid-control-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .grid-panel-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .token-panel-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .grid-panel-body {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
      overscroll-behavior: contain;
    }
    .grid-panel-controls {
      display: grid;
      gap: 10px;
      min-width: 0;
    }
    .grid-close-button,
    .token-close-button {
      width: 28px;
      height: 28px;
      min-width: 28px;
      padding: 0;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .grid-close-button svg,
    .token-close-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .grid-panel label,
    .token-panel label {
      font-size: 13px;
    }
    .token-panel {
      gap: 12px;
      width: min(336px, calc(100vw - 24px));
    }

    .token-select { width: 100%; min-height: 38px; border-radius: 8px; padding: 6px 8px; background: #182033; color: #fff; border: 1px solid rgba(255,255,255,.25); }

    .token-upload-button,
    .token-clear-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid rgba(148, 163, 184, 0.36);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.7);
      color: #f8fafc;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }
    .token-upload-button:hover,
    .token-clear-button:hover {
      border-color: var(--accent);
    }
    .token-clear-button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }
    .token-slider {
      display: grid;
      gap: 6px;
    }
    .token-slider input[type="range"] {
      width: 100%;
    }
    .token-value,
    .token-status {
      color: white;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .token-status {
      color: var(--muted);
      font-weight: 600;
    }
    .grid-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .grid-toggle-row input {
      width: auto;
    }
    .segmented {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 3px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.62);
    }
    .segmented button {
      width: auto;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1;
      border-color: transparent;
      background: transparent;
    }
    .segmented button.active {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.13);
    }
    .grid-slider {
      display: grid;
      gap: 6px;
    }
    .grid-slider input[type="range"] {
      width: 100%;
    }
    .grid-value {
      color: white;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .grid-nudge {
      display: grid;
      grid-template-columns: repeat(3, 32px);
      grid-template-rows: repeat(3, 32px);
      gap: 4px;
      justify-content: start;
      align-self: start;
    }
    .grid-nudge button {
      width: 32px;
      height: 32px;
      min-width: 32px;
      padding: 0;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .grid-nudge button svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .grid-nudge-up { grid-column: 2; grid-row: 1; }
    .grid-nudge-left { grid-column: 1; grid-row: 2; }
    .grid-nudge-right { grid-column: 3; grid-row: 2; }
    .grid-nudge-down { grid-column: 2; grid-row: 3; }
    .grid-save-button {
      margin-top: 0;
      border-color: rgba(56, 189, 248, 0.38);
      background: rgba(8, 47, 73, 0.74);
      font-size: 14px;
      font-weight: 700;
      flex: 0 0 auto;
    }
    @media (max-width: 900px) {
      .controls-panel {
        top: 64px;
        right: 8px;
        width: min(360px, calc(100vw - 16px));
        max-height: calc(100svh - 76px);
      }
      .floating-toolbar {
        top: 8px;
        max-width: calc(100% - 16px);
        overflow-x: auto;
        padding: 6px;
      }
      .tool-button {
        width: 44px;
        height: 44px;
        min-width: 44px;
      }
      .grid-panel,
      .token-panel {
        top: 64px;
        right: 8px;
        width: min(360px, calc(100vw - 16px));
        max-height: calc(100svh - 76px);
      }
      .grid-panel-body {
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 10px;
      }
    }

  </style>
  <link rel="stylesheet" href="toolbar-ui.css?v=20261021-toolbar-active">
  <link rel="stylesheet" href="map-adjust.css">
  <link rel="stylesheet" href="tablet-ui.css?v=20261021-toolbar-active">
</head>
<body class="gm-page">
  <div class="wrap">
<div id="controlsPanel" class="controls-panel" role="region" aria-label="地圖設定" hidden>
      <div class="controls-panel-header">
        <span class="controls-panel-title">地圖設定</span>
        <button id="controlsPanelCloseBtn" class="grid-close-button" type="button" title="收起地圖設定" aria-label="收起地圖設定">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>

      <div id="controlsBody" class="controls-body">
        <div class="toolbar">
        <div class="field field-upload">
          <label for="fileInput">上傳地圖圖片（JPG / PNG / WebP）</label>
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-describedby="mapUploadStatus">
        </div>

        <div class="field slider-field">
          <label for="brushSize">刷子：<span class="value" id="brushSizeValue">100px</span></label>
          <input id="brushSize" type="range" min="10" max="400" step="1" value="100">
        </div>

        <div class="field slider-field zoom-field">
          <label for="zoomRange">縮放：<span class="value" id="zoomValue">100%</span></label>
          <input id="zoomRange" type="range" min="10" max="500" step="5" value="100">
        </div>
        </div>

      <div class="footer-note" id="mapUploadStatus" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="footer-note">
        操作方式：滑鼠滾輪可縮放；用上方圖示切換拖曳模式；雙指手勢可在觸控裝置上縮放與移動。
      </div>
      <div class="cache-actions" aria-label="本機暫存管理">
        <button id="sendPlayersToRoomBtn" type="button">玩家畫面切到此房間</button>
        <button id="clearCurrentOlroomBtn" class="danger" type="button">清除目前 olroom 暫存</button>
        <button id="clearAllOlroomsBtn" class="danger" type="button">清除所有 olroom 暫存</button>
      </div>
      <div class="mode-note" id="modeNote"></div>
      </div>
    </div>

    <div class="panel stage">
      <div id="viewport" class="viewport">

        <div id="floatingToolbar" class="floating-toolbar" aria-label="地圖工具列">
          <button id="toolbarToggleBtn" class="tool-button toolbar-toggle" type="button" title="收合工具列" aria-label="收合工具列" aria-expanded="true" aria-controls="floatingToolbar">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button id="toggleFogBtn" class="tool-button" type="button" title="切換擦霧／補霧" aria-label="切換擦霧或補霧">
            <svg viewBox="0 0 24 24"><path d="M3 15c3-5 6-7 9-7s6 2 9 7"/><path d="M5 18h14"/><path d="M12 8V4"/></svg>
          </button>

          <button id="rectFogBtn" class="tool-button" type="button" title="矩形擦除／補上迷霧" aria-label="矩形擦除或補上迷霧模式">
            <svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="12" rx="1"/><path d="M8 3v4"/><path d="M3 9h4"/><path d="M17 17h4"/><path d="M16 21v-4"/></svg>
          </button>

          <button id="panModeBtn" class="tool-button" type="button" title="拖曳地圖模式" aria-label="拖曳地圖模式">
            <svg viewBox="0 0 24 24"><path d="M12 2v6"/><path d="M12 22v-6"/><path d="M2 12h6"/><path d="M22 12h-6"/><path d="M8 8l4-4 4 4"/><path d="M8 16l4 4 4-4"/></svg>
          </button>

          <button id="rotateBtn" class="tool-button" type="button" title="圖片右轉 90°" aria-label="圖片右轉 90 度">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>
          </button>

          <button id="fitBtn" class="tool-button" type="button" title="適合視窗" aria-label="適合視窗">
            <svg viewBox="0 0 24 24"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M21 16v5h-5"/><path d="M8 21H3v-5"/></svg>
          </button>

          <button id="actualBtn" class="tool-button" type="button" title="100%" aria-label="100%">
            <svg viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M12 4v16"/><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>

          <button id="centerBtn" class="tool-button" type="button" title="置中" aria-label="置中">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M2 12h4"/><path d="M18 12h4"/></svg>
          </button>

          <button id="mapSettingsBtn" class="tool-button" type="button" title="地圖設定" aria-label="地圖設定" aria-controls="controlsPanel" aria-expanded="false">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-9 8"/></svg>
          </button>

          <button id="gridSettingsBtn" class="tool-button" type="button" title="格線設定" aria-label="格線設定" aria-controls="gridPanel" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 10h16"/><path d="M4 16h16"/><path d="M10 4v16"/><path d="M16 4v16"/></svg>
          </button>

          <button id="tokenSettingsBtn" class="tool-button" type="button" title="Token 設定" aria-label="Token 設定" aria-controls="tokenPanel" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M12 3l7 4v10l-7 4-7-4V7z"/><path d="M12 7l3.5 2v6L12 17l-3.5-2V9z"/></svg>
          </button>

          <button id="mapAdjustBtn" class="tool-button" type="button" title="地圖調整" aria-label="地圖調整" aria-controls="mapAdjustPanel" aria-expanded="false">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
          </button>

          <button id="resetFogBtn" class="tool-button danger" type="button" title="重新蓋上迷霧" aria-label="重新蓋上迷霧">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>
          </button>

          <button id="revealAllFogBtn" class="tool-button" type="button" title="全開迷霧" aria-label="全開迷霧">
            <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div id="gridPanel" class="grid-panel" role="region" aria-label="格線設定" hidden>
          <div class="grid-panel-header">
            <span class="grid-panel-title">格線設定</span>
            <button id="gridPanelCloseBtn" class="grid-close-button" type="button" title="收起格線設定" aria-label="收起格線設定">
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>

          <button id="saveGridImageBtn" class="grid-save-button" type="button" disabled>另存包含格線圖片</button>

          <div class="grid-panel-body">
            <div class="grid-nudge" aria-label="格線微移">
              <button class="grid-nudge-up" type="button" data-grid-nudge-y="-1" title="上移 1px" aria-label="格線上移 1px">
                <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
              </button>
              <button class="grid-nudge-left" type="button" data-grid-nudge-x="-1" title="左移 1px" aria-label="格線左移 1px">
                <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg>
              </button>
              <button class="grid-nudge-right" type="button" data-grid-nudge-x="1" title="右移 1px" aria-label="格線右移 1px">
                <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
              </button>
              <button class="grid-nudge-down" type="button" data-grid-nudge-y="1" title="下移 1px" aria-label="格線下移 1px">
                <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12l7 7 7-7"/></svg>
              </button>
            </div>

            <div class="grid-panel-controls">
              <label class="grid-toggle-row" for="gridEnabled">
                <span>顯示格線</span>
                <input id="gridEnabled" type="checkbox">
              </label>

              <div class="segmented" aria-label="格線形狀">
                <button id="gridSquareBtn" type="button">方格</button>
                <button id="gridHexBtn" type="button">六角格</button>
              </div>

              <div class="segmented" aria-label="格線顏色">
                <button id="gridWhiteBtn" type="button">白線</button>
                <button id="gridBlackBtn" type="button">黑線</button>
              </div>

              <div class="grid-slider">
                <div class="grid-control-line">
                  <label for="gridOpacity">透明度</label>
                  <span id="gridOpacityValue" class="grid-value">45%</span>
                </div>
                <input id="gridOpacity" type="range" min="0" max="100" step="1" value="45">
              </div>

              <div class="grid-slider">
                <div class="grid-control-line">
                  <label for="gridSize">格線比例</label>
                  <span id="gridSizeValue" class="grid-value">80px</span>
                </div>
                <input id="gridSize" type="range" min="24" max="240" step="1" value="80">
              </div>

              <div class="grid-slider">
                <div class="grid-control-line">
                  <label for="gridLineWidth">格線粗細</label>
                  <span id="gridLineWidthValue" class="grid-value">1px</span>
                </div>
                <input id="gridLineWidth" type="range" min="1" max="20" step="1" value="1">
              </div>

              <div class="grid-slider">
                <div class="grid-control-line">
                  <label for="gridOffsetX">左右微調</label>
                  <span id="gridOffsetXValue" class="grid-value">0px</span>
                </div>
                <input id="gridOffsetX" type="range" min="-240" max="240" step="1" value="0">
              </div>

              <div class="grid-slider">
                <div class="grid-control-line">
                  <label for="gridOffsetY">上下微調</label>
                  <span id="gridOffsetYValue" class="grid-value">0px</span>
                </div>
                <input id="gridOffsetY" type="range" min="-240" max="240" step="1" value="0">
              </div>

            </div>
          </div>
        </div>

        <div id="tokenPanel" class="token-panel" role="region" aria-label="Token 設定" hidden>
          <div class="token-panel-header">
            <span class="token-panel-title">Token 設定</span>
            <button id="tokenPanelCloseBtn" class="token-close-button" type="button" title="收起 Token 設定" aria-label="收起 Token 設定">
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>

          <button id="tokenUploadBtn" class="token-upload-button" type="button">上傳 token 圖片</button>
          <label for="tokenSelect">目前選取</label>
          <select id="tokenSelect" class="token-select" disabled></select>
          <input id="tokenFileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <button id="tokenLockBtn" class="token-upload-button" type="button" disabled>🔓 未鎖定（點此鎖定）</button>
          <div class="segmented" aria-label="全部 token 鎖定">
            <button id="tokenLockAllBtn" type="button" disabled>全部鎖定</button>
            <button id="tokenUnlockAllBtn" type="button" disabled>全部解鎖</button>
          </div>

          <div class="token-slider">
            <div class="token-control-line">
              <label for="tokenSize">大小</label>
              <span id="tokenSizeValue" class="token-value">96px</span>
            </div>
            <input id="tokenSize" type="range" min="16" max="800" step="1" value="96">
          </div>

          <div class="segmented" aria-label="Token 形狀">
            <button id="tokenSquareBtn" type="button">方形</button>
            <button id="tokenHexBtn" type="button">六角形</button>
          </div>

          <div class="token-slider">
            <div class="token-control-line">
              <label for="tokenHpFontSize">HP 字體大小</label>
              <span id="tokenHpFontSizeValue" class="token-value">24px</span>
            </div>
            <input id="tokenHpFontSize" type="range" min="8" max="96" step="1" value="24" disabled>
          </div>
          <button id="tokenAddInitiativeBtn" class="token-upload-button" type="button" disabled>加入先攻</button>
          <div class="token-hp-help">HP 取自先攻表，僅 GM 可見。</div>
          <button id="tokenClearBtn" class="token-clear-button danger" type="button">移除 token</button>
          <div id="tokenStatus" class="token-status">尚未上傳 token</div>
        </div>

<div id="emptyState" class="empty">尚未載入地圖：點上方工具列的「地圖設定」上傳圖片。</div>
        <div id="canvasHolder" class="canvas-holder" hidden>
          <canvas id="mapCanvas"></canvas>
          <canvas id="gridCanvas"></canvas>
          <canvas id="fogCanvas"></canvas>
          <div id="rectFogPreview" class="rect-fog-preview" aria-hidden="true"></div>
          <div id="tokenLayer" class="token-layer" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="mapAdjustPanel" class="map-adjust-panel" role="region" aria-label="地圖調整" hidden>
    <div class="map-adjust-header">
      <span class="map-adjust-title">地圖調整</span>
      <button id="mapAdjustCloseBtn" class="map-adjust-close-button" type="button" title="收起地圖調整" aria-label="收起地圖調整">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div class="map-adjust-slider">
      <div class="map-adjust-line">
        <label for="mapBrightness">亮度</label>
        <span id="mapBrightnessValue" class="map-adjust-value">100%</span>
      </div>
      <input id="mapBrightness" type="range" min="50" max="200" step="1" value="100">
    </div>

    <div class="map-adjust-slider">
      <div class="map-adjust-line">
        <label for="mapContrast">對比</label>
        <span id="mapContrastValue" class="map-adjust-value">100%</span>
      </div>
      <input id="mapContrast" type="range" min="50" max="175" step="1" value="100">
    </div>

    <div class="map-adjust-slider">
      <div class="map-adjust-line">
        <label for="mapSaturation">飽和度</label>
        <span id="mapSaturationValue" class="map-adjust-value">100%</span>
      </div>
      <input id="mapSaturation" type="range" min="0" max="200" step="1" value="100">
    </div>

    <button id="mapAdjustResetBtn" class="map-adjust-action" type="button">恢復預設</button>
    <button id="saveAdjustedMapBtn" class="map-adjust-action primary" type="button" disabled>另存調整後地圖</button>
    <div class="map-adjust-note">只影響這台裝置的地圖底圖顯示，不會同步給玩家。</div>
  </div>

  <script src="firebase-sync.js"></script>
  <script src="connection-status.js"></script>
  <script src="local-store.js"></script>
  <script src="image-store.js"></script>
  <script src="dice.js"></script>
  <script src="map-adjust.js?v=20261021-toolbar-active"></script>
  <script src="image-processing.js?v=20261021-compression"></script>
  <script src="app.js?v=20261021-room-cache"></script>
  <script src="initiative-sync.js?v=20261021-room-cache"></script>
  <script src="tablet-ui.js?v=20261021-toolbar-active"></script>
  <script>
    // 讓網頁斷網時也能重新整理（只在 https 或 127.0.0.1 等網址有效，http 區網位址會自動略過）。
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch((error) => console.warn("[MapFog 離線]", error));
  </script>
</body>
</html>
